<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokeLab</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <section id="menu" class="screen active">
        <h1>POKELAB</h1>
        <p>MONSTER ROGUELIKE</p>

        <button onclick="newRun()">NUEVA AVENTURA</button>
        <button onclick="loadRun()">CONTINUAR</button>
    </section>

    <section id="starter" class="screen">
        <h2>ELIGE TU STARTER</h2>
        <div id="starterList"></div>
    </section>

    <section id="map" class="screen">

        <header>
            <strong>POKELAB</strong>
            <span id="teamInfo"></span>
        </header>

        <h2>RUTA</h2>

        <div id="mapNodes"></div>

    </section>

    <section id="battle" class="screen">

        <div class="enemy">
            <div id="enemyName"></div>
            <div id="enemyHP"></div>
            <div id="enemySprite"></div>
        </div>

        <div class="player">
            <div id="playerSprite"></div>
            <div id="playerName"></div>
            <div id="playerHP"></div>
        </div>

        <div id="battleLog">
            ¡Comienza el combate!
        </div>

        <div id="moves"></div>

    </section>

    <section id="catch" class="screen">

        <h2>¡NUEVA CRIATURA!</h2>

        <div id="catchList"></div>

        <button onclick="skipCatch()">
            NO RECLUTAR
        </button>

    </section>

</div>

<script src="data.js"></script>
<script src="map.js"></script>
<script src="battle.js"></script>
<script src="game.js"></script>

</body>
</html>
