<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>PokeLab</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <!-- MENU -->

    <section id="menu" class="screen active">

        <div class="logo">
            POKELAB
        </div>

        <div class="subtitle">
            POKÉMON ROGUELIKE
        </div>

        <button onclick="newRun()">
            NEW RUN
        </button>

        <button onclick="loadRun()">
            CONTINUE
        </button>

    </section>


    <!-- STARTER -->

    <section id="starter" class="screen">

        <h1>CHOOSE YOUR STARTER</h1>

        <p class="description">
            Elige un Pokémon para comenzar tu aventura.
        </p>

        <div id="starterList" class="pokemon-grid"></div>

    </section>


    <!-- MAP -->

    <section id="map" class="screen">

        <header>

            <div class="header-logo">
                POKELAB
            </div>

            <div id="teamInfo">
                TEAM 0/6
            </div>

            <div id="coins">
                ₽ 500
            </div>

        </header>

        <div class="map-title">

            <span>ROUTE</span>

            <b id="routeNumber">
                1
            </b>

        </div>

        <div id="mapNodes"></div>

        <div class="team">

            <h2>YOUR TEAM</h2>

            <div id="team"></div>

        </div>

    </section>


    <!-- BATTLE -->

    <section id="battle" class="screen">

        <div class="battle-arena">

            <div class="enemy-side">

                <div class="pokemon-info">

                    <b id="enemyName">
                        —
                    </b>

                    <span id="enemyLevel">
                        Lv. 5
                    </span>

                    <div class="hp-bar">
                        <div id="enemyHPBar"></div>
                    </div>

                </div>

                <img
                    id="enemySprite"
                    class="pokemon-sprite enemy-sprite"
                >

            </div>


            <div class="player-side">

                <img
                    id="playerSprite"
                    class="pokemon-sprite player-sprite"
                >

                <div class="pokemon-info">

                    <b id="playerName">
                        —
                    </b>

                    <span id="playerLevel">
                        Lv. 5
                    </span>

                    <div class="hp-bar">

                        <div id="playerHPBar"></div>

                    </div>

                </div>

            </div>

        </div>


        <div class="battle-bottom">

            <div id="battleLog">
                ¡Comienza el combate!
            </div>

            <div id="moves"></div>

        </div>

    </section>


    <!-- CAPTURE -->

    <section id="capture" class="screen">

        <h1>NEW POKÉMON</h1>

        <p>
            Elige un Pokémon para añadir a tu equipo.
        </p>

        <div id="captureList" class="pokemon-grid"></div>

        <button onclick="skipCapture()">
            CONTINUE
        </button>

    </section>


    <!-- GAME OVER -->

    <section id="gameover" class="screen">

        <div class="logo">
            GAME OVER
        </div>

        <p>
            Tu aventura ha terminado.
        </p>

        <button onclick="newRun()">
            NEW RUN
        </button>

        <button onclick="showScreen('menu')">
            MENU
        </button>

    </section>

</div>


<script src="data.js"></script>
<script src="game.js"></script>
<script src="map.js"></script>
<script src="battle.js"></script>

</body>
</html>
